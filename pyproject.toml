[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rental-reco"
version = "0.1.0"
description = "A reproducible recommendation system for rental products"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "fastapi>=0.100",
  "uvicorn[standard]>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "httpx>=0.24"]

[project.scripts]
rental-reco = "rental_reco.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
